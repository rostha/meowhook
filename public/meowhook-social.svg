<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Meowhook Discord webhook builder</title>
  <desc id="desc">A preview of Meowhook's message editor and Discord-style live preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111219"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b9ff3"/>
      <stop offset="1" stop-color="#7279d7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1140" cy="-32" r="350" fill="#757bd9" opacity=".055"/>
  <circle cx="64" cy="638" r="300" fill="#757bd9" opacity=".035"/>
  <rect x="52" y="49" width="1096" height="532" rx="24" fill="#111218" stroke="#30313f" stroke-width="2"/>
  <path d="M52 131H1148" stroke="#30313f" stroke-width="2"/>
  <rect x="76" y="77" width="30" height="30" rx="9" fill="url(#accent)"/>
  <text x="121" y="100" fill="#f2f2f6" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700">Meowhook</text>
  <text x="1072" y="98" text-anchor="end" fill="#a3a5b5" font-size="14" font-family="Arial, Helvetica, sans-serif">DISCORD WEBHOOK BUILDER</text>
  <text x="91" y="214" fill="#f4f4f8" font-size="49" font-family="Arial, Helvetica, sans-serif" font-weight="700">Make every message</text>
  <text x="91" y="271" fill="#f4f4f8" font-size="49" font-family="Arial, Helvetica, sans-serif" font-weight="700">look right before you send.</text>
  <text x="93" y="323" fill="#c0c0d0" font-size="20" font-family="Arial, Helvetica, sans-serif">Write, preview, and send Discord webhook messages.</text>
  <rect x="91" y="365" width="186" height="39" rx="8" fill="#20212c" stroke="#393b52"/>
  <text x="184" y="390" text-anchor="middle" fill="#e5e5ef" font-size="15" font-family="Arial, Helvetica, sans-serif">Live preview</text>
  <rect x="290" y="365" width="164" height="39" rx="8" fill="#20212c" stroke="#393b52"/>
  <text x="372" y="390" text-anchor="middle" fill="#e5e5ef" font-size="15" font-family="Arial, Helvetica, sans-serif">Rich embeds</text>
  <rect x="467" y="365" width="174" height="39" rx="8" fill="#20212c" stroke="#393b52"/>
  <text x="554" y="390" text-anchor="middle" fill="#e5e5ef" font-size="15" font-family="Arial, Helvetica, sans-serif">Local drafts</text>
  <rect x="91" y="459" width="1018" height="80" rx="12" fill="#181922" stroke="#30313f"/>
  <rect x="112" y="479" width="5" height="40" rx="2" fill="#8189e5"/>
  <text x="134" y="492" fill="#f2f2f6" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700">Your next announcement, welcome note, or update.</text>
  <text x="134" y="518" fill="#afb0c0" font-size="16" font-family="Arial, Helvetica, sans-serif">Build it visually in your browser, then post it to Discord.</text>
</svg>
